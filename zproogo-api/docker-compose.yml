# Optional: PostgreSQL without installing it. Run:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zproogo
    ports:
      - "5432:5432"
    volumes:
      - zproogo_pg:/var/lib/postgresql/data
volumes:
  zproogo_pg:
